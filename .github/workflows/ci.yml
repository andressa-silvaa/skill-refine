name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (warning budget)
        run: npm run lint -- --max-warnings 0

      - name: Check circular dependencies
        run: npm run deps:cycles

      - name: Check i18n keys
        run: npm run i18n:check

      - name: Build
        run: npm run build

  backend-fast-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fast backend regression suite
        run: >
          python manage.py test
          apps.analysis.tests.test_analysis_api
          apps.resumes.tests.test_resume_list_filters
          apps.resumes.tests.test_resume_list_pagination
          apps.resumes.tests.test_pdf_exports
          apps.resumes.tests.test_version_list_pagination_api
          apps.dashboard.tests.test_dashboard_api
          -v 1

  backend-slow-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run slow backend checks
        run: >
          python manage.py test
          apps.resumes.tests.test_query_count
          -v 1
