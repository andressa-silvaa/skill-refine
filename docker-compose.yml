services:
  redis:
    image: redis:7-alpine
    container_name: skill-refine-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: skill-refine-postgres
    restart: unless-stopped
    env_file:
      - ./backend/env.example
    ports:
      - "5433:5432"
    volumes:
      - skill_refine_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skill-refine-backend
    restart: unless-stopped
    env_file:
      - ./backend/env.example
      - ./backend/.env
    environment:
      - DATABASE_URL=postgres://skill_refine:skill_refine@postgres:5432/skill_refine
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - DJANGO_DEBUG=1
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
      - ANALYSIS_MODEL_ROOT=/ml/models
      - ANALYSIS_MODEL_VERSION=analysis_v1_pt
      - ANALYSIS_MODEL_VERSION_BY_LANG=pt-BR=analysis_v1_pt;en-US=analysis_seniority_multi_v2_light;es-ES=analysis_seniority_multi_v2_light
      - ANALYSIS_MODEL_VERSION_BY_TASK=quality=analysis_quality_v9_pt;matching=analysis_matching_v3_reg_pt
      - ANALYSIS_MODEL_VERSION_BY_TASK_LANG=quality:pt-BR=analysis_quality_v9_pt;quality:en-US=analysis_quality_multi_v1_light;quality:es-ES=analysis_quality_multi_v1_light;matching:pt-BR=analysis_matching_v3_reg_pt;matching:en-US=analysis_matching_multi_v1_light;matching:es-ES=analysis_matching_multi_v1_light
      - ANALYSIS_MODEL_MODE=hf
      - ANALYSIS_PREWARM_ENABLED=true
      - ANALYSIS_PREWARM_LANGUAGES=pt-BR
      - ANALYSIS_PARALLEL_INFERENCE=true
      - ANALYSIS_SIGNALS_ML_SENIOR_PROB_THRESHOLD=0.65
      - ANALYSIS_SIGNALS_ML_SENIOR_MIN_TOTAL_MONTHS=48
      - ANALYSIS_SIGNALS_ML_SENIOR_MIN_BULLETS=5
      - ANALYSIS_TEXT_SENIORITY_ENABLED=false
      - ANALYSIS_TEXT_SENIORITY_FUSION_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./ml:/ml
    # --noreload: evita StatReloader em volume montado (Windows/Docker) e POSTs sem resposta.
    # exec: runserver vira PID 1 (sinais/restart corretos). -u: log em tempo real no `docker logs`.
    command: >
      sh -c "set -e && cd /app &&
      python manage.py migrate &&
      echo 'Starting Django runserver on 0.0.0.0:8000...' &&
      exec python -u manage.py runserver 0.0.0.0:8000 --noreload"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 8
      start_period: 120s

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skill-refine-celery
    restart: unless-stopped
    env_file:
      - ./backend/env.example
      - ./backend/.env
    environment:
      - DATABASE_URL=postgres://skill_refine:skill_refine@postgres:5432/skill_refine
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - PYTHONPATH=/app/src
      - ANALYSIS_MODEL_ROOT=/ml/models
      - ANALYSIS_MODEL_VERSION=analysis_v1_pt
      - ANALYSIS_MODEL_VERSION_BY_LANG=pt-BR=analysis_v1_pt;en-US=analysis_seniority_multi_v2_light;es-ES=analysis_seniority_multi_v2_light
      - ANALYSIS_MODEL_VERSION_BY_TASK=quality=analysis_quality_v9_pt;matching=analysis_matching_v3_reg_pt
      - ANALYSIS_MODEL_VERSION_BY_TASK_LANG=quality:pt-BR=analysis_quality_v9_pt;quality:en-US=analysis_quality_multi_v1_light;quality:es-ES=analysis_quality_multi_v1_light;matching:pt-BR=analysis_matching_v3_reg_pt;matching:en-US=analysis_matching_multi_v1_light;matching:es-ES=analysis_matching_multi_v1_light
      - ANALYSIS_MODEL_MODE=hf
      - ANALYSIS_PREWARM_ENABLED=true
      - ANALYSIS_PREWARM_LANGUAGES=pt-BR
      - ANALYSIS_PARALLEL_INFERENCE=true
      - ANALYSIS_SIGNALS_ML_SENIOR_PROB_THRESHOLD=0.65
      - ANALYSIS_SIGNALS_ML_SENIOR_MIN_TOTAL_MONTHS=48
      - ANALYSIS_SIGNALS_ML_SENIOR_MIN_BULLETS=5
      - ANALYSIS_TEXT_SENIORITY_ENABLED=false
      - ANALYSIS_TEXT_SENIORITY_FUSION_ENABLED=false
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - TOKENIZERS_PARALLELISM=false
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./ml:/ml
    command: sh -c "PYTHONPATH=/app/src celery -A config.celery worker -l info --pool=solo --concurrency=1"

volumes:
  skill_refine_postgres_data:
