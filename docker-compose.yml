services:
  ollama:
    image: ollama/ollama:latest
    container_name: skill-refine-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - skill_refine_ollama_data:/root/.ollama

  postgres:
    image: postgres:16-alpine
    container_name: skill-refine-postgres
    restart: unless-stopped
    env_file:
      - ./backend/env.example
    ports:
      - "5433:5432"
    volumes:
      - skill_refine_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skill-refine-backend
    restart: unless-stopped
    env_file:
      - ./backend/env.example
      - ./backend/.env
    environment:
      - DATABASE_URL=postgres://skill_refine:skill_refine@postgres:5432/skill_refine
      - DJANGO_DEBUG=1
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
      - AI_LOCAL_BASE_URL=http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

volumes:
  skill_refine_postgres_data:
  skill_refine_ollama_data:

